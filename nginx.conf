server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Security headers. Nothing is loaded from a third party, so every source
    # is 'self'; style-src also allows inline styles for the few style attributes.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.web3forms.com; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'self'; form-action 'self' https://api.web3forms.com; frame-ancestors 'self'; object-src 'none'" always;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    # woff2 is already compressed; do not waste cycles on it.

    # Filenames are not fingerprinted, so HTML revalidates every time and the
    # rest is cached hard. Set these with `expires` rather than `add_header`:
    # any add_header inside a location drops the server-level headers above.
    location ~* \.html$ {
        expires -1;
    }

    # Stylesheet and script revalidate on every load (a cheap 304 when nothing
    # changed), so a deploy can never pair new HTML with an old cached design.
    location ~* \.(css|js)$ {
        expires -1;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff2|mp4)$ {
        expires 1y;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    if ($request_method !~ ^(GET|HEAD)$ ) {
        return 405;
    }
}
